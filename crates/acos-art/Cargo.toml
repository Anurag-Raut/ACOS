[package]
name = "acos-art"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Reproducible launcher for real Google ART (dalvikvm64 from the API-34 ART APEX) inside an unprivileged bwrap mini-Android root: sysroot layout, /apex mounts, linkerconfig, apex-info-list, properties, logd sink, structured run results (ADR: docs/DECISION_ART_RUNTIME.md)."

[lib]
name = "acos_art"
path = "src/lib.rs"

[[bin]]
name = "acos-art"
path = "src/main.rs"

[dependencies]
acos-sandbox = { path = "../acos-sandbox" }
acos-binder-peer = { path = "../acos-binder-peer" }
acos-render = { path = "../acos-render" }
acos-services = { path = "../acos-services" }
# LAUNCHEXTRAS: the typed launch `Intent` (action/data/extras) the host encodes.
acos-protocol = { path = "../acos-protocol" }
# WV5b: the lazy WebView gate + the shared broker endpoint contract.
acos-webview = { path = "../acos-webview" }
acos-wm = { path = "../acos-wm" }
# REL3I3: `BinderId` names the input channel an action was delivered to (the
# settle's window-removal witness is keyed by it).
acos-parcel = { path = "../acos-parcel" }
# NET2: the relay client (`spike_net` under ACOS_NET_ARM=relay).
acos-netd = { path = "../acos-netd" }
# VIEW1a: the live-view frame encoder (jpeg/png only, no default formats).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
fdeflate = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Shared test-only helpers (the SUN_LEN scratch-root rule).
acos-test-support = { path = "../acos-test-support" }
# SHOTZ: the round-trip tests decode the PNG the capture path wrote.
png = "0.17"
