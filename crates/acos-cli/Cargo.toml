[package]
name = "acos-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The `acos` command-line interface."

[[bin]]
name = "acos"
path = "src/main.rs"

[dependencies]
acos-apk = { path = "../acos-apk" }
acos-art = { path = "../acos-art" }
# GLSHIP: the doctor reports the guest GL provider from the shared contract
# (`acos-gles-provider`), not from a second copy of the selection rule.
acos-gles-provider = { path = "../acos-gles-provider" }
acos-jni = { path = "../acos-jni" }
acos-dex = { path = "../acos-dex" }
acos-mcp = { path = "../acos-mcp" }
acos-native-loader = { path = "../acos-native-loader" }
# NET2: the session API's net controls (`acos_net` serve verb) speak the relay
# supervisor's own control protocol.
acos-netd = { path = "../acos-netd" }
acos-protocol = { path = "../acos-protocol" }
acos-render = { path = "../acos-render" }
acos-wm = { path = "../acos-wm" }
acos-runtime = { path = "../acos-runtime" }
acos-sandbox = { path = "../acos-sandbox" }
acos-services = { path = "../acos-services" }
acos-verify = { path = "../acos-verify" }
acos-vm = { path = "../acos-vm" }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2"
acos-test-support = { path = "../acos-test-support" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
