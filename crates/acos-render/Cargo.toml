[package]
name = "acos-render"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ACOS offscreen software 2D renderer: a Rust replacement for Android's HWUI/Skia/minikin stack (tiny-skia geometry, FreeType glyph masks, rustybuzz shaping)."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Rasterisation: a Rust port of Skia's software rasteriser; keeps AA/blend
# behaviour close to Android's software canvas.
tiny-skia = "0.11"

# Text: HarfBuzz port for shaping (kerning/GSUB/GPOS/ligatures/bidi runs),
# ttf-parser for outlines + metrics (TrueType + CFF + variable fonts).
rustybuzz = "0.20"
ttf-parser = "0.25"
unicode-bidi = "0.3"
unicode-script = "0.5"

# Android fonts.xml parsing (read-only DOM for a ~1000 line config file).
roxmltree = "0.21"

# Memory-map font files so a font is shared read-only across every surface and
# context instead of being copied per session (Android mmaps /system/fonts too).
memmap2 = "0.9"

# Image decoding for BitmapFactory-style ingest.
png = "0.17"
jpeg-decoder = "0.3"
image-webp = "0.2"

# Fast non-crypto content hashing + optional sha256.
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sha2 = "0.10"

# Glyph rasterisation (ADR-0019). `bundled` statically builds the pinned
# FreeType 2.13.2 source shipped with freetype-sys (the version AOSP QPR
# android-14.0.0_r75 uses); it needs no host libfreetype and fails at build
# time with a clear cc error if the vendored C cannot compile. Remove the
# `bundled` feature to link the host libfreetype instead (pkg-config).
freetype-sys = { version = "0.23", features = ["bundled"] }

[dev-dependencies]
proptest = "1"
acos-test-support = { path = "../acos-test-support" }

[[example]]
name = "render_scene"
path = "examples/render_scene.rs"

[[example]]
name = "bench_render"
path = "examples/bench_render.rs"

[[example]]
name = "bench_text_draw"
path = "examples/bench_text_draw.rs"
