[package]
name = "acos-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MCP (Model Context Protocol) stdio server exposing the ACOS agent API to AI coding agents."

[[bin]]
name = "acos-mcp"
path = "src/main.rs"

[lib]
name = "acos_mcp"
path = "src/lib.rs"

[dependencies]
acos-protocol = { path = "../acos-protocol" }
acos-runtime = { path = "../acos-runtime" }
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
