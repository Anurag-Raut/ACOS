[package]
name = "acos-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MCP (Model Context Protocol) stdio server exposing the ACOS agent API to AI coding agents."

[[bin]]
name = "acos-mcp"
path = "src/main.rs"

[lib]
name = "acos_mcp"
path = "src/lib.rs"

[dependencies]
acos-jni = { path = "../acos-jni" }
# NET4: the `acos_net` tool's argument schema is defined once, in the network
# module, and advertised verbatim here (no second copy to drift from).
acos-netd = { path = "../acos-netd" }
acos-protocol = { path = "../acos-protocol" }
acos-runtime = { path = "../acos-runtime" }
acos-sandbox = { path = "../acos-sandbox" }
# ADR-0029 item 6: `acos_capabilities` and the help limits section are generated
# from the service-module registry, so a module cannot exist without appearing in
# the docs.
acos-services = { path = "../acos-services" }
libc = "0.2"
# SHOTZ: decode + downscale an image for a bounded MCP image reply.
png = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
acos-test-support = { path = "../acos-test-support" }
