[package]
name = "acos-services"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ACOS in-process Android system services: Binder dispatch, mini PMS/ATMS, Settings provider and display/misc state machines."

[dependencies]
acos-aidl = { path = "../acos-aidl" }
acos-apk = { path = "../acos-apk" }
acos-dex = { path = "../acos-dex" }
# NET5: the relay's control surface (the `network` module's control ops and
# `acos_net` share one action table).
acos-netd-ctl = { path = "../acos-netd-ctl" }
acos-parcel = { path = "../acos-parcel" }
acos-protocol = { path = "../acos-protocol" }
acos-sfgeom = { path = "../acos-sfgeom" }
acos-wm = { path = "../acos-wm" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rustix = { version = "1.1", features = ["net", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = "1"
# HYG2: the one rule for a missing test prerequisite (fail loudly, counted skip
# only under ACOS_ALLOW_ART_SKIP=1).
acos-test-support = { path = "../acos-test-support" }

[[example]]
name = "scan-parcelables"
path = "examples/scan_parcelables.rs"

[[example]]
name = "scan-write-calls"
path = "examples/scan_write_calls.rs"
