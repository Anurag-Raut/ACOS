[package]
name = "acos-services"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ACOS in-process Android system services: Binder dispatch, mini PMS/ATMS, Settings provider and display/misc state machines."

[dependencies]
acos-aidl = { path = "../acos-aidl" }
acos-apk = { path = "../acos-apk" }
acos-dex = { path = "../acos-dex" }
acos-parcel = { path = "../acos-parcel" }
acos-protocol = { path = "../acos-protocol" }
acos-sfgeom = { path = "../acos-sfgeom" }
acos-wm = { path = "../acos-wm" }
rustix = { version = "1.1", features = ["net", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = "1"
# The real-Java differential (`tests/client_transaction_java.rs`) runs the case
# on the ACOS VM with the real framework DEX, exactly like the runtime harness.
# A dev-dependency cycle (acos-runtime depends on this crate) is what Cargo
# allows for test-only edges.
acos-runtime = { path = "../acos-runtime" }
acos-vm = { path = "../acos-vm" }

[[example]]
name = "scan-parcelables"
path = "examples/scan_parcelables.rs"

[[example]]
name = "scan-write-calls"
path = "examples/scan_write_calls.rs"
