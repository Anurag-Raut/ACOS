[package]
name = "acos-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ACOS runtime: owns the VM + in-process ServiceHost wiring and the Binder transport (T-19/T-21)."

[dependencies]
acos-aidl = { path = "../acos-aidl" }
acos-apk = { path = "../acos-apk" }
acos-dex = { path = "../acos-dex" }
acos-jni = { path = "../acos-jni" }
acos-render = { path = "../acos-render" }
acos-parcel = { path = "../acos-parcel" }
acos-services = { path = "../acos-services" }
acos-vm = { path = "../acos-vm" }
acos-wm = { path = "../acos-wm" }
thiserror = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_json = { workspace = true }
# LAUNCHEXTRAS: the launch-Intent differential builds the same protocol value
# the host receives from a scenario.
acos-protocol = { path = "../acos-protocol" }
acos-gles = { path = "../acos-gles" }
acos-native-loader = { path = "../acos-native-loader" }
acos-sandbox = { path = "../acos-sandbox" }
acos-test-support = { path = "../acos-test-support" }
zip = { version = "2", default-features = false, features = ["deflate"] }
