[package]
name = "acos-jni"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Real JNI for ACOS: a JNINativeInterface/JavaVM function table backed by the Rust VM, wired to the native ELF loader."
build = "build.rs"

[lib]
name = "acos_jni"
path = "src/lib.rs"

[dependencies]
acos-dex = { path = "../acos-dex" }
acos-gles = { path = "../acos-gles" }
acos-native-loader = { path = "../acos-native-loader" }
acos-vm = { path = "../acos-vm" }
libc = "0.2"
thiserror = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
acos-dex = { path = "../acos-dex" }
serde_json = { workspace = true }
acos-test-support = { path = "../acos-test-support" }
acos-sandbox = { path = "../acos-sandbox" }
png = "0.17"
