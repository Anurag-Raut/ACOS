[package]
name = "acos-native-loader"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rust-owned ELF/Bionic native loader for ACOS: maps Bionic-targeted x86_64 Android .so files, relocates them, and binds their imports to a Rust bionic compatibility table."
build = "build.rs"

[lib]
name = "acos_native_loader"
path = "src/lib.rs"

[dependencies]
acos-sandbox = { path = "../acos-sandbox" }
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
cc = "1"

[dev-dependencies]
serde_json = { workspace = true }
# NDK-surface integration test: a real `Bitmap` pixel store + a real APK zip.
acos-render = { path = "../acos-render" }
zip = { version = "2", default-features = false, features = ["deflate"] }
# HYG3: a missing test prerequisite fails loudly instead of printing SKIP.
acos-test-support = { path = "../acos-test-support" }
