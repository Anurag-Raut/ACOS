[package]
name = "acos-native-loader"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rust-owned ELF/Bionic native loader for ACOS: maps Bionic-targeted x86_64 Android .so files, relocates them, and binds their imports to a Rust bionic compatibility table."
build = "build.rs"

[lib]
name = "acos_native_loader"
path = "src/lib.rs"

[dependencies]
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
cc = "1"

[dev-dependencies]
serde_json = { workspace = true }
