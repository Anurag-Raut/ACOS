[package]
name = "acos-dex"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Clean-room parser, instruction decoder, and structural verifier for Dalvik DEX files"

[dependencies]
thiserror.workspace = true
# Derive-only serialization of the parsed id/string/type/method pools for the
# on-disk boot cache. borsh is already in the workspace lock graph via acos-vm.
borsh = { version = "1", features = ["derive"] }

[dev-dependencies]
acos-test-support = { path = "../acos-test-support" }
serde_json.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }

[[example]]
name = "dexdump"
path = "examples/dexdump.rs"
