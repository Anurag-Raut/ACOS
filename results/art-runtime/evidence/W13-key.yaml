# W13: the engine's `key` step reaches a focused view through the real
# InputChannel. DPAD_DOWN moves focus to the counter's Increment button,
# ENTER activates it (the app's own click listener) -> count 0 becomes 1.
version: 1
name: w13-key-focus
description: >-
  Launch counter on real ART, move focus with DPAD_DOWN, activate the focused
  Increment button with ENTER, and require the live tree to read 1. This is the
  W13 key path: window focus (InputChannel FOCUS) is delivered and the IME
  focus request is answered by the ServiceHost, so key events are no longer
  dropped with "no window focus".
app: fixtures/build/apps/counter.apk
engine: native-preferred
fallback: report-and-escalate
api_level: 34
isolation: process
display:
  mode: offscreen
  width: 1080
  height: 2400
  density_dpi: 420
capabilities:
  - lifecycle
  - ui.text
  - input
expectation: pass
budgets:
  memory_mib: 512
  wall_ms: 120000
steps:
  - launch:
      activity: dev.acos.fixtures.counter/.MainActivity
      clear_state: true

  - wait_for:
      selector: {id: count}
      timeout_ms: 5000

  - assert_text:
      selector: {id: count}
      text: {exact: "0"}

  - key:
      key: dpad_down

  - key:
      key: enter

  - assert_text:
      selector: {id: count}
      text: {exact: "1"}
