# WV4 evidence arm: the identical WV3 probe with the expectation flipped to the
# post-broker truth (`pass`), run against results/handoff/WV4/evidence/
# minimal-listener.py listening on the mapped host socket. It proves the guest
# connect succeeds and the WIRE `hello` round-trips; it is NOT a WebView engine
# test (the listener has no engine — the broker is WVB's crate). The committed
# scenario (results/handoff/WV3/webview-probe-provider.yaml, copied to
# results/handoff/WV4/) keeps `expectation: fail` + ASSERTION_FAILED until that
# broker lands.
version: 1
name: webview-probe-provider
description: >-
  Launch webview-probe with com.android.webview installed and assert the
  fixture's own WebView-constructed status (the `status` TextView must contain
  "WebView created:"), with a minimal test listener on the mapped host socket
  (no broker, no engine): the guest connect and the WIRE hello are what is
  under test here.
app: fixtures/build/apps/webview-probe.apk
engine: native-preferred
fallback: report-and-escalate
api_level: 34
isolation: process
extra_apks:
  - fixtures/build/apps/webview-provider.apk
display:
  mode: offscreen
  width: 1080
  height: 2400
  density_dpi: 420
capabilities:
  - lifecycle
  - ui.offscreen
  - ui.text
expectation: pass
budgets:
  memory_mib: 512
  wall_ms: 120000
steps:
  - launch:
      activity: dev.acos.fixtures.webview/.MainActivity
      clear_state: true
  - wait_for:
      selector: {id: status}
      timeout_ms: 8000
  # The fixture reports every stage into `status` (logcat tag WVProbe), so this
  # is the WebView-constructed assertion, not a liveness check on the activity.
  - assert_text:
      selector: {id: status}
      text: {contains: "WebView created:"}
      timeout_ms: 12000
