# WV6 negative control: the same end-to-end probe with no WebView broker at all
# (ACOS_WEBVIEW_GATE=0). The provider must fail loudly with ENGINE_UNAVAILABLE
# and the scenario must fail at "WebView created:" -- never a pass.
version: 1
name: webview-probe-no-engine
description: >-
  webview-probe with no WebView broker listening: the provider reports
  ENGINE_UNAVAILABLE and the WebView-constructed assertion fails
  (ASSERTION_FAILED), so the pass arm cannot be reached without a real engine.
app: fixtures/build/apps/webview-probe.apk
engine: native-preferred
fallback: report-and-escalate
api_level: 34
isolation: process
extra_apks:
  - fixtures/build/apps/webview-provider.apk
display:
  mode: offscreen
  width: 1080
  height: 2400
  density_dpi: 420
capabilities:
  - lifecycle
  - ui.offscreen
  - ui.text
expectation: fail
expect_error:
  code: ASSERTION_FAILED
budgets:
  memory_mib: 512
  wall_ms: 120000
steps:
  - launch:
      activity: dev.acos.fixtures.webview/.MainActivity
      clear_state: true
  - wait_for:
      selector: {id: status}
      timeout_ms: 8000
  - assert_text:
      selector: {id: status}
      text: {contains: "WebView created:"}
      timeout_ms: 12000
