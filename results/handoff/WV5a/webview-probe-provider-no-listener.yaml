# WV5a negative control (arm 1, no listener): the same probe with nothing
# listening on the mapped host socket. `expectation: fail` + ASSERTION_FAILED is
# the honest truth — `AcosSessionSocket.open` reports ENGINE_UNAVAILABLE, the
# WebView constructor throws, and the `status` view never reaches the "WebView
# created:" stage. Flipping this to `pass` would be a false pass, so the
# scenario is pinned as a negative; see results/handoff/WV5a/README.md.
version: 1
name: webview-probe-provider-no-listener
description: >-
  Negative control: the WV5a probe with no listener on /run/acos/webview.sock.
  The provider must fail honestly (ENGINE_UNAVAILABLE) and the WebView must not
  be reported as constructed.
app: fixtures/build/apps/webview-probe.apk
engine: native-preferred
fallback: report-and-escalate
api_level: 34
isolation: process
extra_apks:
  - fixtures/build/apps/webview-provider.apk
display:
  mode: offscreen
  width: 1080
  height: 2400
  density_dpi: 420
capabilities:
  - lifecycle
  - ui.offscreen
  - ui.text
expectation: fail
expect_error:
  code: ASSERTION_FAILED
budgets:
  memory_mib: 512
  wall_ms: 120000
steps:
  - launch:
      activity: dev.acos.fixtures.webview/.MainActivity
      clear_state: true
  - wait_for:
      selector: {id: status}
      timeout_ms: 8000
  - assert_text:
      selector: {id: status}
      text: {contains: "WebView created:"}
      timeout_ms: 12000
