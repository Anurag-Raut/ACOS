# MODLOC2 evidence: a live module **detach** as a scenario step.
#
# `service_ctl {op: detach}` is the scenario spelling of
# `acos_services {op: "detach"}`, so the detach that MODLOC proved with an
# out-of-band MCP driver (`live_location.py`) is now part of the verdict: the app
# runs on a working scripted `location` module, the scenario detaches it, and the
# app's own next API call (the "Check again" button re-runs the whole probe through
# the framework client it already holds) shows the honest answer.
#
# A **live attach** cannot be observed by this app, and that is the honest limit,
# not a bug: `SystemServiceRegistry` caches one `LocationManager` per process and
# that object keeps the `ILocationManager` binder it resolved at construction, so
# after a replace-on-attach the guest still talks to the old handle (the
# structured "module is not attached" answer). Detach is observable because the
# cached handle is exactly what must stop working. To see an *attach*, the app
# must resolve the service again (a fresh process, i.e. the launch path) — which
# is what `location-probe.yaml` (attach at launch) covers.
version: 1
name: location-live-detach
description: "location: scripted at launch, a delivered fix, a live detach, then the app's honest answer."
app: fixtures/build/apps/location-probe.apk
api_level: 34
isolation: process
display:
  mode: offscreen
  width: 1080
  height: 2400
  density_dpi: 420
capabilities:
  - ui.offscreen
  - ui.text
  - input
expectation: pass
budgets:
  memory_mib: 512
  wall_ms: 180000
services:
  - id: location
    profile: scripted
    config:
      permissions: fine
steps:
  - launch:
      activity: dev.acos.fixtures.locationprobe/.MainActivity
      clear_state: true
  - wait_for:
      selector: {id: state}
      timeout_ms: 20000
  - assert_text:
      selector: {id: state}
      text: {contains: "state=ready providers=fused,gps,network,passive"}
  - service_ctl:
      module: location
      op: set_location
      args: {lat: 37.4220, lng: -122.0841, accuracy: 4.0, provider: gps}
  - tap: {selector: {id: check}}
  - wait_for:
      selector: {id: last, text: {contains: "37.4220"}}
      timeout_ms: 20000
  - assert_text:
      selector: {id: last}
      text: {contains: "last=37.4220,-122.0841"}
  # The attach/detach lifecycle word, in-band, on the same channel as the MCP
  # `acos_services {op: "detach"}`.
  - service_ctl: {module: location, op: detach}
  # The app re-runs every location call through the binder it already holds; the
  # module is gone, so the answer must be the honest one, never a stale fix.
  - tap: {selector: {id: check}}
  - wait_for:
      selector: {id: state, text: {contains: "state=unavailable"}}
      timeout_ms: 20000
  - assert_text:
      selector: {id: last}
      text: {exact: "last=none"}
  - assert_text:
      selector: {id: fix}
      text: {exact: "fix=none"}
