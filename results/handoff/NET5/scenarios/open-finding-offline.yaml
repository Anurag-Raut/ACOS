# OPEN FINDING (NET5), not a gate: this scenario reproduces a bug, so it is kept
# out of scenarios/ until it passes. Step 6 (`assert_text status contains
# Exception`) is the failing one: after the module's `offline` control, the
# app's second fetch in the same process never completes — see
# results/handoff/NET5/FINDING-offline.md. Everything before it passes
# (step 3 is the module control itself).
#
# `network:real` + the module's hot controls: the app loses the network and gets
# it back, in ONE guest process.
#
# `offline` drops this session's traffic on its own veth (its own netns only),
# the app's Retry button re-runs the same HTTPS GET and shows the exception, and
# `online` restores it and the next Retry is HTTP 200 again. Nothing is
# relaunched, so the two failures and the recovery are the same process under the
# same relay session.
version: 1
name: net-network-offline
description: >-
  `network:real` on ART: a real HTTPS GET returns HTTP 200, the module's
  `offline` control makes the next fetch in the same process fail, and `online`
  restores it.
app: fixtures/build/apps/net-check.apk
fallback: report-and-escalate
api_level: 34
isolation: process
display:
  mode: offscreen
  width: 1080
  height: 2400
  density_dpi: 420
capabilities:
  - lifecycle
  - ui.offscreen
  - ui.text
services:
  - id: network
    profile: real
expectation: pass
budgets:
  memory_mib: 512
  wall_ms: 180000
steps:
  - launch:
      activity: dev.acos.fixtures.netcheck/.MainActivity
      clear_state: true

  - wait_for:
      selector: {id: status}
      timeout_ms: 5000

  - assert_text:
      selector: {id: status}
      text: {exact: HTTP 200}
      timeout_ms: 60000

  # The module's own control op, through the one module control path.
  - service_ctl:
      module: network
      op: offline
  - wait_for:
      selector: {id: retry}
      timeout_ms: 5000

  # The app asks again and sees the loss: an exception, not a status code.
  - tap:
      selector: {id: retry}
  - assert_text:
      selector: {id: status}
      text: {contains: Exception}
      timeout_ms: 60000
  - assert_log:
      tag: NetCheck
      since_previous_step: true
      ordered: true
      patterns:
        - '^fetch failed: .*'
        - '^fetch result=.*Exception.*$'

  # ...and gets it back.
  - service_ctl:
      module: network
      op: online
  - tap:
      selector: {id: retry}
  - assert_text:
      selector: {id: status}
      text: {exact: HTTP 200}
      timeout_ms: 60000
  - assert_log:
      tag: NetCheck
      since_previous_step: true
      ordered: true
      patterns:
        - '^fetch result=HTTP 200$'

  - assert_no_crash: {}
