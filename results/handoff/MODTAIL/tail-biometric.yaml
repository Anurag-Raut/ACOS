# MODTAIL proof: hw.biometric attached at launch, scripted.
version: 1
name: tail-biometric
description: >-
  hw.biometric at `scripted`: BiometricManager.canAuthenticate answers the
  script, and `acos_service_ctl {op: auth}` completes a real
  `BiometricPrompt.authenticate` with the scripted success and lockout results.
  The prompt UI is a reported gap (the window layer stack is not built).
app: ../../../fixtures/build/apps/tail-probe.apk
api_level: 34
isolation: process
display:
  mode: offscreen
  width: 1080
  height: 2400
  density_dpi: 420
capabilities:
  - ui.offscreen
  - ui.text
  - input
expectation: pass
budgets:
  memory_mib: 512
  wall_ms: 240000
services:
  - id: hw.biometric
    profile: scripted
    config:
      can_authenticate: success
steps:
  - launch:
      activity: dev.acos.fixtures.tailprobe/.MainActivity
      clear_state: true
  - wait_for:
      selector: {text: {contains: "READY"}}
      timeout_ms: 20000
  - tap:
      selector: {text: {exact: "Biometric"}}
  - wait_for:
      selector: {text: {contains: "BIOMETRIC canAuthenticate=SUCCESS"}}
      timeout_ms: 20000

  - tap:
      selector: {text: {exact: "Authenticate"}}
  - wait_for:
      selector: {text: {contains: "AUTH:REQUESTED"}}
      timeout_ms: 20000
  - service_ctl:
      module: hw.biometric
      op: auth
      args: {result: success}
  - wait_for:
      selector: {text: {contains: "AUTH:SUCCESS type=2"}}
      timeout_ms: 20000

  # A second prompt, answered with a lockout error.
  - tap:
      selector: {text: {exact: "Authenticate"}}
  - service_ctl:
      module: hw.biometric
      op: auth
      args: {result: lockout}
  - wait_for:
      selector: {text: {contains: "AUTH:ERROR code=7"}}
      timeout_ms: 20000

  # The scripted canAuthenticate answer is what the next query returns.
  - service_ctl:
      module: hw.biometric
      op: set
      args: {can_authenticate: none_enrolled, enrolled: false}
  - tap:
      selector: {text: {exact: "Biometric"}}
  - wait_for:
      selector: {text: {contains: "BIOMETRIC canAuthenticate=NONE_ENROLLED"}}
      timeout_ms: 20000
