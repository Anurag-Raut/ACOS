# MODTAIL2 diagnostic: does the Bluetooth tab's click handler block inside
# `BluetoothManager.getAdapter()`? The tap uses `settle: fast` so the step does
# not wait for a frame that will never come; the following `wait_for` holds the
# session open long enough to dump the guest's threads (SIGQUIT) and read the
# guest log. This is a reproducer, not a proof: `expectation: pass` is wrong on
# purpose so the run cannot be mistaken for evidence.
version: 1
name: probe-bluetooth-hang
description: >-
  hw.bluetooth scripted; tap the Bluetooth tab with a fast settle and then hold
  the session, to capture the guest's stack while the click handler is blocked.
app: ../../../fixtures/build/apps/tail-probe.apk
api_level: 34
isolation: process
display:
  mode: offscreen
  width: 1080
  height: 2400
  density_dpi: 420
capabilities:
  - ui.offscreen
  - ui.text
  - input
expectation: pass
budgets:
  memory_mib: 512
  wall_ms: 240000
services:
  - id: hw.bluetooth
    profile: scripted
    config:
      on: false
steps:
  - launch:
      activity: dev.acos.fixtures.tailprobe/.MainActivity
      clear_state: true
  - wait_for:
      selector: {text: {contains: "READY"}}
      timeout_ms: 20000
  - tap:
      selector: {text: {exact: "Bluetooth"}}
      # Long enough to attach and dump the guest's threads while the click
      # handler is blocked.
      settle_timeout_ms: 90000
  - service_ctl:
      module: hw.bluetooth
      op: state
