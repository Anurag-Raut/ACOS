# SETTLE5: the NET4 n5 fixture shape with the network module OFF.
#
# The NET4 n5x3 settle failures (`strict settle timed out (probe-floor)` on
# `capture`/`observe`) were seen with this APK. Its launch is heavier than
# counter's (a background fetch thread + ConnectivityManager report), so it is
# the scenario the concurrency repro uses; nothing here needs the network: with
# ACOS_SPIKE_NET unset the fetch fails fast into `id=status` and the tree still
# settles, so only the settle path is measured.
version: 1
name: settle5-netcheck
description: >-
  Launch net-check with the network module off and take three settled captures
  of the idle screen: the settle path, not the network.
app: fixtures/build/apps/net-check.apk
# `--engine art` on the command line (a scenario `engine:` field only takes the
# backend vocabulary).
fallback: report-and-escalate
api_level: 34
isolation: process
display:
  mode: offscreen
  width: 1080
  height: 2400
  density_dpi: 420
capabilities:
  - lifecycle
  - ui.offscreen
  - ui.text
expectation: pass
budgets:
  memory_mib: 512
  wall_ms: 120000
steps:
  - launch:
      activity: dev.acos.fixtures.netcheck/.MainActivity
      clear_state: true

  - wait_for:
      selector: {id: status}
      timeout_ms: 5000

  - assert_text:
      selector: {id: url}
      text: {exact: https://example.com}

  - capture:
      name: s5-net-a
      format: png
      fresh: true

  - capture:
      name: s5-net-b
      format: png
      fresh: true

  - assert_visible:
      selector: {id: connectivity}

  - capture:
      name: s5-net-c
      format: png
      fresh: true
