version: 1
name: diag-multi-two-back
description: diag
app: fixtures/build/apps/multi-activity.apk
engine: native-preferred
fallback: report-and-escalate
api_level: 34
isolation: process
display: {mode: offscreen, width: 1080, height: 2400, density_dpi: 420}
capabilities: [lifecycle, ui.offscreen, ui.text, input, storage]
expectation: pass
budgets: {memory_mib: 512, wall_ms: 90000}
steps:
  - launch:
      activity: dev.acos.fixtures.multiactivity/.MainActivity
      clear_state: true
  - wait_for:
      selector: {id: message}
      timeout_ms: 5000
  - tap: {selector: {id: message}}
  - type: {selector: {id: message}, text: Hello}
  - tap: {selector: {id: send}}
  - assert_text: {selector: {id: received}, text: {exact: "Received: Hello"}}
  - key: {key: back, settle: content}
  - back: {}
  - assert_log:
      tag: AcosMulti
      since_previous_step: true
      ordered: true
      patterns: ['^Second.onPause$', '^Main.onStart$', '^Main.onResume$']
