[workspace]

[package]
name = "b-loader"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
acos-native-loader = { path = "vendor/acos-native-loader" }
acos-sandbox = { path = "../../../crates/acos-sandbox" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[[bin]]
name = "gapscan"
path = "src/bin/gapscan.rs"

[[bin]]
name = "artspike"
path = "src/bin/artspike.rs"
