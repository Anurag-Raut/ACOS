# BINDERPID: the calling identity a binder transaction carries, end to end on
# real ART.
#
# Two guest processes in one session (`proc-a` launched, `proc-b` installed as an
# extra APK, each at its own uid) exercise both directions:
#
# * **guest -> host**: inside a hosted service the caller is the app process.
#   `Binder.getCallingUid()` is that process's uid and
#   `Binder.getCallingPid()` the pid the kernel reported on its connection
#   (`SO_PEERCRED`), which is also what the activity manager's `ProcessRecord`
#   and `services status` name — not the old `4242` placeholder.
# * **guest -> guest**: `proc-a` binds `proc-b`'s `EchoService` and transacts. The
#   peer relays the transaction, and the target must see **A's** uid/pid as the
#   caller (the kernel reports the calling process, and the relay restamps it),
#   never `system_server` and never 0.
# * **per-uid permission**: `Context.checkCallingPermission` asks the permission
#   service by uid, so the two apps get different answers for one grant
#   (`system.permissions` grants `INTERNET` to the session's primary package
#   only).
#
# Every line asserted here comes from the guest's own framework
# (`Binder.getCallingUid/Pid`, `PackageManager.getNameForUid`,
# `Context.checkCallingPermission`) or from the binder driver's frame header.
version: 1
name: binderpid
description: >-
  proc-a and proc-b (two uids) each report their own binder identity and their
  per-uid INTERNET permission, and proc-b's bound service reports proc-a as the
  caller of a guest -> guest transaction.
app: fixtures/build/apps/proc-a.apk
extra_apks:
  - fixtures/build/apps/proc-b.apk
engine: art
fallback: report-and-escalate
api_level: 34
isolation: process
display:
  mode: offscreen
  width: 1080
  height: 2400
  density_dpi: 420
capabilities:
  - lifecycle
  - ui.offscreen
  - ui.text
services:
  # One runtime-permission table for the session; the grant is for the primary
  # package (proc-a), so proc-b's uid must answer DENIED for the same permission.
  - id: system.permissions
    profile: real
    config:
      grant:
        - android.permission.INTERNET
expectation: pass
budgets:
  memory_mib: 1024
  wall_ms: 240000
steps:
  - launch:
      activity: dev.acos.fixtures.proca/.ProcAActivity
      clear_state: true

  - assert_text:
      selector: {id: start_b}
      text: {exact: "Start B"}
      timeout_ms: 20000

  # 1. proc-a's own identity: its uid is the package's, its own thread answers
  #    its own pid, the package manager resolves that uid to its package, and the
  #    session's runtime grant makes INTERNET granted for *its* uid (0).
  #    BINDERPID: the placeholder pid (4242) or a uid of 0 fails this pattern.
  - assert_log:
      since_previous_step: false
      timeout_ms: 20000
      ordered: true
      patterns:
        - '^ACOSPROBE a identity pkg=dev\.acos\.fixtures\.proca uid=10[0-9]{3} pid=[1-9][0-9]* calling-uid=10[0-9]{3} calling-pid=[1-9][0-9]* uid-pkg=dev\.acos\.fixtures\.proca internet=-?[0-9]+ self=0 by-name=0$'

  # 2. Spawn proc-b (its own guest process, its own uid in the same session) by
  #    starting its Activity. `Application.onCreate` runs once per process and
  #    reports the process's own identity plus the per-uid permission answer.
  - tap:
      selector: {id: start_b}

  - assert_text:
      selector: {id: finish}
      text: {exact: "Finish B"}
      timeout_ms: 60000

  # B's process reports the identity *it* has. Note: today the guest uid is a
  # session-wide constant (`guest_uid()` in acos-art), so B's `Process.myUid()`
  # is the session uid and its permission answer is that uid's — the package
  # manager *did* allocate proc-b its own uid (the activity manager's
  # `ProcessRecord` for tag 1 carries it), but the guest process does not run
  # under it yet. That is the per-process-uid wall reported with this handoff,
  # not something this scenario may pretend away: B's line asserts its **own**
  # package resolution and a real (non-zero) calling identity, and B must not
  # claim A's package for its uid.
  - assert_log:
      since_previous_step: false
      timeout_ms: 30000
      ordered: true
      patterns:
        - '^ACOSPROBE b identity pkg=dev\.acos\.fixtures\.procb uid=10[0-9]{3} pid=[1-9][0-9]* calling-uid=10[0-9]{3} calling-pid=[1-9][0-9]* uid-pkg=[a-z0-9_.]+ internet=-?[0-9]+ self=-?[0-9]+$'

  # 3. Back to A, then bind B's already-running service: a guest -> guest
  #    transaction whose target reports the caller it saw.
  - tap:
      selector: {id: finish}

  - assert_text:
      selector: {id: start_b}
      text: {exact: "Start B"}
      timeout_ms: 60000

  - tap:
      selector: {id: bind_b}

  - assert_text:
      selector: {id: status}
      text: {exact: "A transact echo:ping"}
      timeout_ms: 60000

  # B's `onTransact` sees A as the caller: A's uid (its own, not 1000 =
  # system_server, and not B's) and A's host-visible pid.
  - assert_log:
      since_previous_step: false
      timeout_ms: 20000
      patterns:
        - '^ACOSPROBE b transact code=1 in=ping -> out=echo:ping pid=[1-9][0-9]* caller-uid=10[0-9]{3} caller-pid=[1-9][0-9]*$'
