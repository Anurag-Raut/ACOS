# MPROC1 step 2: the intent capture target (app side).
#
# `intent-probe` shares text (`ACTION_SEND` text/plain) and picks an image
# (`ACTION_GET_CONTENT` image/* through `startActivityForResult(42)`) in a
# session that has **no** app installed to handle either. On a device those
# two starts go to the share sheet and the photo picker; here they land in the
# session's capture target (the broker, no process), which records the intent
# and answers `START_SUCCESS` — so the app's `startActivity` does not throw and
# `startActivityForResult` waits for a real answer.
#
# What the app itself can prove is asserted here: both starts were accepted
# (the `ACOSPROBE` lines are printed only *after* the call returned) and the
# pick is waiting for its result. The capture record and the scripted result
# round trip are driven through the session control op
# (`acos session ctl --op last|result`) — see
# `results/handoff/MPROC1/evidence-step2.md`.
version: 1
name: mproc1-intents
description: >-
  Launch the intent probe with no share/pick target installed and verify that
  both implicit intents are accepted (captured by the session) instead of
  throwing ActivityNotFoundException.
app: fixtures/build/apps/intent-probe.apk
engine: native-preferred
fallback: report-and-escalate
api_level: 34
isolation: process
display:
  mode: offscreen
  width: 1080
  height: 2400
  density_dpi: 420
capabilities:
  - lifecycle
  - ui.offscreen
  - ui.text
expectation: pass
budgets:
  memory_mib: 512
  wall_ms: 60000
steps:
  - launch:
      activity: dev.acos.fixtures.intentprobe/.MainActivity
      clear_state: true

  - wait_for:
      selector: {id: status}
      timeout_ms: 5000

  # `startActivity(ACTION_SEND)` returned: the capture target accepted it.
  - assert_log:
      tag: AcosIntentProbe
      since_previous_step: false
      ordered: true
      patterns:
        - '^ACOSPROBE shared action=android\.intent\.action\.SEND type=text/plain text=Shared from ACOS$'
        # `startActivityForResult(ACTION_GET_CONTENT, 42)` returned too; the
        # result itself arrives later (scripted by the agent).
        - '^ACOSPROBE pick-request action=android\.intent\.action\.GET_CONTENT type=image/\* request=42$'

  - assert_text:
      selector: {id: status}
      text: {contains: "pick requested: image/*"}
      timeout_ms: 5000

  - assert_text:
      selector: {id: share}
      text: {exact: "Share text"}
      timeout_ms: 5000

  - assert_text:
      selector: {id: pick}
      text: {exact: "Pick image"}
      timeout_ms: 5000
