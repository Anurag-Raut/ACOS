# P11: settle-lab case `progress-timeout`.
#
# With real animations the indeterminate ProgressBar never stops drawing, so
# strict settle times out. In `acos verify` a timed-out settle step is a
# structured TIMEOUT (never a pass): the verifier must not assert on a screen
# that is still changing. The agent-facing session/MCP path still returns the
# latest tree and frame identity with `settled:false` for inspection.
version: 1
name: p11-progress-timeout
description: >-
  Infinite indeterminate ProgressBar: strict settle times out and the verify
  step fails as TIMEOUT; the latest tree/frame is kept as evidence. The
  animations-off passing counterpart is p12-progress-anim-off.
app: fixtures/build/apps/settle-lab.apk
engine: native-preferred
fallback: report-and-escalate
api_level: 34
isolation: process
display:
  mode: offscreen
  width: 1080
  height: 2400
  density_dpi: 420
capabilities:
  - lifecycle
  - ui.offscreen
  - ui.text
  - input
animations: on
expectation: non_pass
budgets:
  memory_mib: 512
  wall_ms: 120000
steps:
  - launch:
      activity: dev.acos.fixtures.settletab/.MainActivity
      clear_state: true
  - wait_for:
      selector: {id: progress_start}
      timeout_ms: 5000
  - tap:
      selector: {id: progress_start}
