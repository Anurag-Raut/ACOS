# S8 hostile fixture, UNTRUSTED region: host-observed pixels are allowed on an
# untrusted run, and they disagree with the forged claim. The app draws solid
# red in the middle of the content area; the scenario requires at least two
# distinct colours there (the region a truthful text claim would produce).
# Run only with ACOS_ALLOW_UNTRUSTED_FOR_TESTS=1.
version: 1
name: s8-hostile-region
description: >-
  Host-observed region assertion on the hostile APK. It must fail because the
  guest draws solid red while claiming text appeared; pixels never stand in for
  the expected text.
trust: untrusted
app: fixtures/build/apps/hostile-probe.apk
engine: native-preferred
fallback: report-and-escalate
api_level: 34
isolation: process
display:
  mode: offscreen
  width: 1080
  height: 2400
  density_dpi: 420
capabilities:
  - lifecycle
  - screenshot
# SCENHYG: declared honestly. The host-observed capture after the hostile app's
# update never reaches the probe floor, so the strict settle ends in TIMEOUT
# (`probe-floor`); the fixture is a hostile-tree probe, not a renderer test. The
# pinned timeout is the current truthful outcome; re-point to `pass` when the
# probe floor is met for this fixture.
expectation: non_pass
expectation_reason: >-
  Host-observed capture never reaches the probe floor on this hostile fixture:
  the strict settle is a truthful TIMEOUT (probe-floor).
expect_error: {code: TIMEOUT, reason: probe-floor}
budgets:
  memory_mib: 512
  wall_ms: 120000
steps:
  - launch:
      activity: dev.acos.fixtures.hostileprobe/.MainActivity
      clear_state: true
  - assert_region:
      x: 100
      y: 528
      w: 100
      h: 100
      min_distinct_colors: 2
