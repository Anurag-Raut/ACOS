# MODTAIL proof: hw.bluetooth attached at launch, scripted.
version: 1
name: tail-bluetooth
description: >-
  hw.bluetooth at `scripted`: the adapter starts off, `acos_service_ctl
  {op:set, args:{on:true}}` delivers ACTION_STATE_CHANGED, `BluetoothAdapter`
  reports the scripted name/address, `getBondedDevices` returns the scripted
  list through the client's ISynchronousResultReceiver, and a scripted scan
  delivers ACTION_FOUND with a real BluetoothDevice parcel extra.
app: ../fixtures/build/apps/tail-probe.apk
api_level: 34
isolation: process
display:
  mode: offscreen
  width: 1080
  height: 2400
  density_dpi: 420
capabilities:
  - ui.offscreen
  - ui.text
  - input
expectation: pass
budgets:
  memory_mib: 512
  wall_ms: 240000
services:
  - id: hw.bluetooth
    profile: scripted
    config:
      on: false
steps:
  - launch:
      activity: dev.acos.fixtures.tailprobe/.MainActivity
      clear_state: true
  - wait_for:
      selector: {text: {contains: "READY"}}
      timeout_ms: 20000
  - tap:
      selector: {text: {exact: "Bluetooth"}}
  - wait_for:
      selector: {text: {contains: "BLUETOOTH state=OFF"}}
      timeout_ms: 20000

  # Turning the adapter on is a real framework event (ACTION_STATE_CHANGED).
  - service_ctl:
      module: hw.bluetooth
      op: set
      args: {on: true}
  - wait_for:
      selector: {text: {contains: "BTSTATE ON"}}
      timeout_ms: 20000
  - tap:
      selector: {text: {exact: "Bluetooth"}}
  - wait_for:
      selector: {text: {contains: "BLUETOOTH state=ON name=ACOS Scripted address=02:00:00:00:00:01"}}
  - wait_for:
      selector: {text: {contains: "BONDED device=ACOS Headset 11:22:33:44:55:66"}}
      timeout_ms: 20000

  # Classic discovery: startDiscovery through IBluetooth, then the scripted
  # results as ACTION_FOUND broadcasts.
  - tap:
      selector: {text: {exact: "Scan"}}
  - wait_for:
      selector: {text: {contains: "SCAN started=true"}}
      timeout_ms: 20000
  - service_ctl:
      module: hw.bluetooth
      op: scan
      args:
        devices:
          - {address: "AA:BB:CC:DD:EE:01", name: "ACOS Beacon", rssi: -40}
          - {address: "AA:BB:CC:DD:EE:02", name: "ACOS Tag", rssi: -66}
  - wait_for:
      selector: {text: {contains: "FOUND name=ACOS Beacon address=AA:BB:CC:DD:EE:01 rssi=-40"}}
      timeout_ms: 20000
  - wait_for:
      selector: {text: {contains: "FOUND name=ACOS Tag address=AA:BB:CC:DD:EE:02 rssi=-66"}}
