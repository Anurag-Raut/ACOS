# MODNOTIF5: the notification module end to end on ART, POST_NOTIFICATIONS granted.
#
# The fixture is a plain framework app: it creates a channel, posts one
# notification with a `PendingIntent.getActivity` content intent and one action
# (`Notification.Action` with its own PendingIntent), and prints
# `NotificationManager.areNotificationsEnabled()`. Every line asserted here was
# produced by the real framework stack: `NotificationManager.notify` ->
# `INotificationManager.enqueueNotificationWithTag` -> the `system.notifications`
# module, which decodes the MODNOTIF3 notification parcel.
#
# The control ops are the system's own state (`service_ctl` -> the module's
# `list`/`tap`/`dismiss`), asserted with `expect` so the step is a check, not
# just evidence:
#   * `list`   - id/tag/channel/title/text/actions, the decoded notification;
#   * `tap`    - the fired content sender's `{start_result}`. It does NOT assert
#                a second window: a system-originated launch is the MPROC
#                delivery class (one LaunchActivityItem per session today);
#   * `dismiss` - the record is gone (`posted: []`).
version: 1
name: notif-perm-granted
description: >-
  notif-perm-probe on ART with POST_NOTIFICATIONS pre-granted: the notification is
  posted and decoded (title/text/channel/action), its content PendingIntent fires
  through the real sender record ({start_result}), and dismiss removes it.
app: fixtures/build/apps/notif-perm-probe.apk
api_level: 34
isolation: process
display:
  mode: offscreen
  width: 1080
  height: 2400
  density_dpi: 420
capabilities:
  - ui.offscreen
  - ui.text
services:
  # The permission controller's store holds the grant; the notifications module
  # reads the same table for the gate (one runtime-permission table, MODNOTIF2).
  - id: system.permissions
    profile: real
    config:
      grant:
        - android.permission.POST_NOTIFICATIONS
  - id: system.notifications
    profile: real
expectation: pass
budgets:
  memory_mib: 640
  wall_ms: 180000
steps:
  - launch:
      activity: dev.acos.fixtures.notifpermprobe/.MainActivity
      clear_state: true

  # 1. The gate is open and the app's own view says so.
  - wait_for:
      selector: {id: enabled}
      timeout_ms: 20000
  - assert_text:
      selector: {id: enabled}
      text: {exact: "enabled: true"}
      timeout_ms: 10000
  - assert_text:
      selector: {id: posted}
      text: {exact: "posted: id 7"}
  - assert_text:
      selector: {id: channel}
      text: {exact: "channel: probe"}

  # 2. The system really posted it: the module's record carries the decoded
  #    channel, title/text and the one action.
  - service_ctl:
      module: system.notifications
      op: list
      # The control reply carries the module's own answer under `value`
      # (ADR-0029 item 4 control path: `{ok, cmd, id, op, value, modules[]}`).
      expect:
        ok: true
        op: list
        value:
          notifications_enabled: true
          channels:
            - id: probe
              name: Probe
              importance: 3
          posted:
            - id: 7
              tag: probe-notification
              channel: probe
              title: Probe title
              text: Probe text
              actions:
                - index: 0
                  title: Open
          dropped: []

  # 3. Tap: the content PendingIntent is fired by the system (a real
  #    PendingIntent record; `start_result` 0 = ActivityManager.START_SUCCESS).
  - service_ctl:
      module: system.notifications
      op: tap
      args: {id: 7}
      expect:
        value:
          fired:
            id: 7
            action: null
            result: {start_result: 0}

  # 4. The action PendingIntent fires the same way (index 0).
  - service_ctl:
      module: system.notifications
      op: action
      args: {id: 7, index: 0}
      expect:
        value:
          fired:
            id: 7
            action: 0
            result: {start_result: 0}

  # 5. Dismiss removes the record; the list is empty again.
  - service_ctl:
      module: system.notifications
      op: dismiss
      args: {id: 7}
      expect:
        value:
          remaining: 0
  - service_ctl:
      module: system.notifications
      op: list
      expect:
        value:
          posted: []
