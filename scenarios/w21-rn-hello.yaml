# W21/W23: rn-hello mounts — the live teeth for the React surface.
#
# History. W20's first error was `create_react_context` dying with
# `SecurityException: No permission to set the priority of 17`
# (`setpriority(-4)` refused by the host's hard `RLIMIT_NICE=0`); W21 added the
# guest-only clamp in the LD_PRELOAD shim (`crates/acos-art/shim/artshim.c`) so
# the thread lives, the Hermes bundle loads and the JS entry point runs
# (`ReactNativeJS: Running "rnhello"`). The surface still stayed empty.
#
# W23 found the first deviation: this fixture's DEX referenced
# `okhttp3.JavaNetCookieJar` but did not define it (the class lives in
# `okhttp-urlconnection`, which is `optional` in react-android's POM). Fresco's
# module initializer therefore threw `NoClassDefFoundError` on the
# `mqt_native_modules` thread, killing that Looper; every UIManager call JS made
# afterwards was posted to a dead queue, so no view batch was ever dispatched.
# With the artifact staged (`tools/build/rn-hello-deps.py`) the tree mounts. The
# `Invalid resource ID 0x0000000b` lines W21 recorded were this launcher's own
# view-walk probe resolving RN's `View.generateViewId()` ids, not an app error;
# the probe now skips ids without a package byte.
#
# The tap this scenario used to perform (display y=1100) was a miss — the JS
# Button sits at display y 1231..1324 — so it only proved input delivery. The
# correct tap and the JS state round trip are `scenarios/w23-rn-hello-tap.yaml`;
# this row is the mount: the app's own text plus a C1 frame that shows it.
version: 1
name: w21-rn-hello
description: >-
  Launch rn-hello on real ART (Hermes bundle, legacy Paper UIManager) and
  require the JS-rendered tree ("Hello ACOS" and the Button title) plus a fresh
  C1 buffer capture.
app: fixtures/build/apps/rn-hello.apk
engine: native-preferred
fallback: report-and-escalate
api_level: 34
isolation: process
display:
  mode: offscreen
  width: 1080
  height: 2400
  density_dpi: 420
capabilities:
  - lifecycle
  - ui.text
  - input
expectation: pass
budgets:
  memory_mib: 512
  wall_ms: 120000
steps:
  - launch:
      activity: dev.acos.fixtures.rnhello/.MainActivity
      clear_state: true

  - wait_for:
      selector: {text: {exact: "Hello ACOS"}}
      timeout_ms: 30000

  - assert_text:
      selector: {text: {exact: "React Native + Hermes"}}
      text: {exact: "React Native + Hermes"}

  - assert_text:
      selector: {text: {exact: "TAP ME"}}
      text: {exact: "TAP ME"}

  - capture:
      name: rn-hello-js
      format: png
      fresh: true
