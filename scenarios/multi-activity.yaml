# multi-activity: Intent extras between two activities, back stack, state save.
#
# Expected values come from fixtures/reference/multi-activity/art-api34-x86_64/
# (1080x2400 @ 420 dpi). Log tag AcosMulti, prefixed Main./Second.
version: 1
name: multi-activity
description: >-
  Launch multi-activity, type a message, send it to SecondActivity via an
  Intent extra, verify the received text, Finish back to MainActivity, rotate
  (the typed message is preserved via onSaveInstanceState), then verify the
  AcosMulti lifecycle across both activities.
app: fixtures/build/apps/multi-activity.apk
engine: native-preferred
fallback: report-and-escalate
api_level: 34
isolation: process
display:
  mode: offscreen
  width: 1080
  height: 2400
  density_dpi: 420
capabilities:
  - lifecycle
  - ui.offscreen
  - ui.text
  - input
  - storage
# SCENHYG: declared honestly. Every step up to the first Back passes; that Back
# (SecondActivity -> the resumed MainActivity below) ends in TIMEOUT
# (`no-draw-after-action`): the window below is re-shown from the compositor's
# store without a new draw, and the strict settle rule demands one. Same open
# REL3A/PERF4 seam as hello-views; re-point to `pass` when Back settles on the
# window forest/tree change rather than on a new frame.
expectation: non_pass
expectation_reason: >-
  Back to the activity below ends in a truthful TIMEOUT (no-draw-after-action):
  the cached window is re-shown without a draw - open REL3A/PERF4 settle seam.
expect_error: {code: TIMEOUT, reason: no-draw-after-action}
budgets:
  memory_mib: 512
  wall_ms: 60000
steps:
  - launch:
      activity: dev.acos.fixtures.multiactivity/.MainActivity
      clear_state: true

  - wait_for:
      selector: {id: message}
      timeout_ms: 5000

  - assert_text:
      selector: {id: message}
      text: {exact: Message}
      bounds: [42, 317, 1038, 435]

  - assert_text:
      selector: {id: send}
      text: {exact: Send}
      bounds: [42, 435, 273, 561]

  - assert_log:
      tag: AcosMulti
      since_previous_step: false
      ordered: true
      patterns:
        - '^Main.onCreate$'
        - '^Main.onStart$'
        - '^Main.onResume$'

  # ---- send the message to the second activity ---------------------------
  - tap:
      selector: {id: message}
  - type:
      selector: {id: message}
      text: Hello
  - tap:
      selector: {id: send}

  - assert_log:
      tag: AcosMulti
      since_previous_step: true
      ordered: true
      patterns:
        - '^Main.send message=Hello$'
        - '^Second.onCreate$'
        - '^Second.received=Hello$'

  - assert_text:
      selector: {id: received}
      text: {exact: "Received: Hello"}
      bounds: [42, 317, 295, 368]

  - capture:
      name: second-activity
      format: png
      fresh: true

  # ---- Back returns to MainActivity through the back stack ---------------
  # The framework's own Back (IActivityClientController.onBackPressed ->
  # requestFinish -> finishActivity). AOSP order (fixtures/reference/
  # multi-activity lifecycle-summary): the Activity below is restarted and
  # resumed BEFORE the finished one is stopped and destroyed.
  - back: {}

  - assert_log:
      tag: AcosMulti
      since_previous_step: true
      ordered: true
      patterns:
        - '^Second.onPause$'
        - '^Main.onStart$'
        - '^Main.onResume$'
        - '^Second.onStop$'
        - '^Second.onDestroy$'

  - assert_text:
      selector: {id: message}
      text: {exact: Hello}
      bounds: [42, 317, 1038, 435]

  # ---- rotate: MainActivity state saved and restored ---------------------
  - rotate:
      orientation: landscape

  - assert_log:
      tag: AcosMulti
      since_previous_step: true
      ordered: true
      patterns:
        - '^Main.onSaveInstanceState message=Hello$'

  - assert_text:
      selector: {id: message}
      text: {exact: Hello}
      bounds: [170, 231, 2358, 349]

  - rotate:
      orientation: portrait

  - assert_text:
      selector: {id: message}
      text: {exact: Hello}
      bounds: [42, 317, 1038, 435]

  # Back on the last Activity finishes the task: no window remains.
  - back: {}

  - assert_no_crash: {}

  - assert_not_visible:
      selector: {id: message}
