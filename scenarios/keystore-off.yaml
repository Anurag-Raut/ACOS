# ADR-0029 `security.keystore` honest off proof: default-off failure + logcat breadcrumb.
#
# Same fixture, same APK, no `security.keystore` module attached: `Security.getProvider("AndroidKeyStore")`
# stays `null` and `KeyStore.getInstance("AndroidKeyStore")` fails honestly with
# `KeyStoreException: AndroidKeyStore not found`, while the diagnostic hook logs
# a loud `W/ACOSKeyStore` `UNSUPPORTED_ANDROID_API` breadcrumb naming `security.keystore`
# and the launch attach call.
version: 1
name: keystore-off
description: >-
  keystore-probe on ART with `security.keystore` omitted (`off`): verifies
  `Security.getProvider("AndroidKeyStore")` stays null, `KeyStore.getInstance`
  throws `AndroidKeyStore not found`, and `acos_logs` receives the
  `UNSUPPORTED_ANDROID_API` diagnostic warning naming `security.keystore`.
app: fixtures/build/apps/keystore-probe.apk
engine: art
fallback: report-and-escalate
api_level: 34
isolation: process
display:
  mode: offscreen
  width: 1080
  height: 2400
  density_dpi: 420
capabilities:
  - ui.offscreen
  - ui.text
expectation: pass
budgets:
  memory_mib: 640
  wall_ms: 180000
steps:
  - launch:
      activity: dev.acos.fixtures.keystoreprobe/.MainActivity
      clear_state: true

  - wait_for:
      selector: {text: {contains: "KEYPROBE mode=default_off"}}
      timeout_ms: 20000

  - assert_text:
      selector: {text: {contains: "KEYPROBE mode=default_off"}}
      text: {exact: "KEYPROBE mode=default_off pass=2 fail=0"}
      timeout_ms: 10000

  - assert_log:
      tag: ACOSKeyStore
      since_previous_step: false
      timeout_ms: 10000
      patterns:
        - "UNSUPPORTED_ANDROID_API: AndroidKeyStore is disabled \\(security\\.keystore module is off\\).*security\\.keystore.*SECURITY_LEVEL_SOFTWARE"

  - assert_log:
      tag: KeystoreProbe
      since_previous_step: false
      timeout_ms: 10000
      patterns:
        - "^KEYPROBE mode=default_off pass=2 fail=0$"
