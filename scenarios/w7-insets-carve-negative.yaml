# W7 NEGATIVE (must fail under `ACOS_WM_INSETS=carve`).
#
# The same edge-to-edge probe, asserting the *report* contract while the WMS is
# carving. On the carved frame `InsetsState.calculateInsets(mWinFrame, ...)`
# has no status/nav source inside the frame, so `status` reads 0 and the window
# is `[0,128][1080,2337]`. A pass here would mean the carve model is still
# handing the app a full-display frame and reporting insets, i.e. the selector
# is not switching the model.
version: 1
name: w7-insets-carve-negative
description: >-
  The report contract under the carve selector: status=128 must fail because the
  carved window reports zero insets. Must produce status=fail.
app: fixtures/build/apps/insets-probe.apk
engine: native-preferred
fallback: forbid
api_level: 34
isolation: process
display: {mode: offscreen, width: 1080, height: 2400, density_dpi: 420}
expectation: fail
budgets: {memory_mib: 1024, wall_ms: 120000}
steps:
  - launch: {activity: dev.acos.fixtures.insetsprobe/.MainActivity, clear_state: true}
  - wait_for: {selector: {id: status}, timeout_ms: 20000}
  - assert_text: {selector: {id: status}, text: {exact: "status=128"}}
  - assert_text: {selector: {id: frame}, text: {exact: "frame=[0,0][1080,2400]"}}
