# NEGATIVE: the selected list row does not exist in a fresh todo list.
# Must produce status=fail (ELEMENT_NOT_FOUND/ASSERTION_FAILED), never pass.
version: 1
name: negative-todo-missing-item
description: Assert a list item that was never added.
app: fixtures/build/apps/todo-list.apk
engine: native-preferred
fallback: forbid
api_level: 34
isolation: process
display: {mode: offscreen, width: 1080, height: 2400, density_dpi: 420}
expectation: fail
steps:
  - launch:
      activity: dev.acos.fixtures.todolist/.MainActivity
      clear_state: true
  - wait_for:
      selector: {id: input}
      timeout_ms: 5000
  - assert_visible:
      selector: {text: {exact: eggs}}
