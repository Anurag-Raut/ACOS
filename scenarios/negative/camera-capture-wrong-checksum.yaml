# CAMERA3 (Slice 2) negative control: real capture runs on ART, but the scenario
# asserts a wrong test-pattern CRC32 checksum. Must produce status=fail
# (ASSERTION_FAILED), never pass.
version: 1
name: camera-capture-wrong-checksum
description: >-
  CAMERA3 negative: camera-probe captures a real 640x480 YUV_420_888 frame on
  ART, then the scenario asserts a wrong CRC32 checksum so it must fail with
  ASSERTION_FAILED.
app: fixtures/build/apps/camera-probe.apk
api_level: 34
isolation: process
display:
  mode: offscreen
  width: 1080
  height: 2400
  density_dpi: 420
capabilities:
  - ui.offscreen
  - ui.text
  - input
services:
  - id: system.permissions
    profile: real
  - id: hw.camera
    profile: stub
expectation: fail
expect_error: {code: ASSERTION_FAILED}
budgets:
  memory_mib: 640
  wall_ms: 180000
steps:
  - launch:
      activity: dev.acos.fixtures.cameraprobe/.MainActivity
      clear_state: true
  - wait_for:
      selector: {text: {contains: "READY mgr=present feat_cam=true feat_any=true"}}
      timeout_ms: 20000

  - service_ctl:
      module: system.permissions
      op: grant
      args: {permission: "android.permission.CAMERA"}
      expect:
        ok: true

  - tap:
      selector: {text: {exact: "Capture"}}
  - wait_for:
      selector: {text: {contains: "CAPTURE closed id=0"}}
      timeout_ms: 30000

  # Frame 0 really has crc32=0xdead8870; asserting a wrong checksum must fail.
  - assert_text:
      selector: {id: status}
      text: {contains: "crc32=0x00000000"}
