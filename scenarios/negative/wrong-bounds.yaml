# NEGATIVE: correct text, wrong bounds.
# Must produce status=fail; text alone is not enough when bounds are claimed.
version: 1
name: negative-wrong-bounds
description: Assert the correct initial result text with deliberately wrong bounds.
app: fixtures/build/apps/hello-views.apk
engine: native-preferred
fallback: forbid
api_level: 34
isolation: process
display: {mode: offscreen, width: 1080, height: 2400, density_dpi: 420}
expectation: fail
steps:
  - launch:
      activity: dev.acos.fixtures.helloviews/.MainActivity
      clear_state: true
  - wait_for:
      selector: {id: result}
      timeout_ms: 5000
  - assert_text:
      selector: {id: result}
      text: {exact: "clicks: 0"}
      bounds: [0, 0, 1, 1]
