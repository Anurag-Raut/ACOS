# gaten-content-welcome-wrong: NEGATIVE CONTROL for SE2's `settle: content`.
#
# Same forever-animating welcome screen bound by the content-stable rule, but the
# scenario expects text the welcome screen does not show. A content-settled tree
# still evaluates its assertions normally: wrong text must be ASSERTION_FAILED,
# never a pass. This proves content settle is not a "skip the assertion" mode.
version: 1
name: gaten-content-welcome-wrong
description: >-
  SE2 negative: the content-stable welcome screen does not contain the expected
  text, so the assertion must fail.
app: /home/Qui/Projects/acos/.cache/gaten/gaten-dev-f344272-x86_64-release-unsigned.apk
engine: native-preferred
fallback: forbid
api_level: 34
isolation: process
display: {mode: offscreen, width: 1080, height: 2400, density_dpi: 400}
animations: off
expectation: fail
# SE2b: pin the failure. A content-settled tree still evaluates assertions
# normally, so the wrong text must be an ASSERTION_FAILED diff - not a timeout
# and not an unapplied rule.
expect_error: {code: ASSERTION_FAILED}
budgets: {memory_mib: 4096, wall_ms: 240000}
steps:
  - launch:
      activity: com.gaten.app.MainActivity
      clear_state: true
      settle: content
      settle_timeout_ms: 20000
  # SE2b: the assert must re-prove the content window on fresh traversals (the
  # cached tree is never evidence), so this also covers finding 2 in the
  # verifier path.
  - assert_text:
      selector: {text: {contains: "Set up Gaten"}}
      text: {contains: "This text does not exist"}
