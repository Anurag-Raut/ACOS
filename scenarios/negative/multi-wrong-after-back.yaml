# ROT8 negative: after a real hardware Back from SecondActivity the app below is
# resumed and redrawn; a wrong expectation about its text must fail strictly.
version: 1
name: negative-multi-wrong-after-back
description: Back from SecondActivity, then assert MainActivity text that was never typed.
app: fixtures/build/apps/multi-activity.apk
engine: native-preferred
fallback: forbid
api_level: 34
isolation: process
display: {mode: offscreen, width: 1080, height: 2400, density_dpi: 420}
# BACKSETTLE: the claim this file is for is now reached. The field was typed
# into, so the soft input takes the first Back (AOSP layer order, as in
# `hello-views`/`multi-activity`); the second Back returns to MainActivity and
# the strict settle binds it. The last `assert_text` then fails strictly
# (`ASSERTION_FAILED`) on the text that was never typed - a wrong expectation
# after a real Back must never pass.
expectation: fail
steps:
  - launch:
      activity: dev.acos.fixtures.multiactivity/.MainActivity
      clear_state: true
  - wait_for:
      selector: {id: message}
      timeout_ms: 5000
  - tap:
      selector: {id: message}
  - type:
      selector: {id: message}
      text: Hello
  - tap:
      selector: {id: send}
  - assert_text:
      selector: {id: received}
      text: {exact: "Received: Hello"}
  # The soft input takes the first Back; the second reaches the Activity.
  - key:
      key: back
      settle: content
  - back: {}
  - assert_text:
      selector: {id: message}
      text: {exact: Goodbye}
