# NEGATIVE: the app is correct but the expected count is wrong.
# Must produce status=fail (ASSERTION_FAILED), never pass.
version: 1
name: negative-counter-wrong-count
description: Assert a counter value the fixture never renders.
app: fixtures/build/apps/counter.apk
engine: native-preferred
fallback: forbid
api_level: 34
isolation: process
display: {mode: offscreen, width: 1080, height: 2400, density_dpi: 420}
expectation: fail
steps:
  - launch:
      activity: dev.acos.fixtures.counter/.MainActivity
      clear_state: true
  - wait_for:
      selector: {id: count}
      timeout_ms: 5000
  - assert_text:
      selector: {id: count}
      text: {exact: "99"}
