# CAMERA4 (Slice 3) negative control: real JPEG capture decodes to 640x480,
# while the scenario asserts wrong decoded BitmapFactory dimensions (1280x720).
# Must fail with ASSERTION_FAILED.
version: 1
name: camera-jpeg-wrong-size
description: >-
  CAMERA4 negative: camera-probe captures ImageFormat.JPEG (640x480) on ART
  and decodes it with BitmapFactory, then the scenario asserts wrong dimensions
  bmp=1280x720 so it must fail with ASSERTION_FAILED.
app: fixtures/build/apps/camera-probe.apk
api_level: 34
isolation: process
display:
  mode: offscreen
  width: 1080
  height: 2400
  density_dpi: 420
capabilities:
  - ui.offscreen
  - ui.text
  - input
services:
  - id: system.permissions
    profile: real
  - id: hw.camera
    profile: stub
expectation: fail
expect_error: {code: ASSERTION_FAILED}
budgets:
  memory_mib: 640
  wall_ms: 180000
steps:
  - launch:
      activity: dev.acos.fixtures.cameraprobe/.MainActivity
      clear_state: true
  - wait_for:
      selector: {text: {contains: "READY mgr=present feat_cam=true feat_any=true"}}
      timeout_ms: 20000

  - service_ctl:
      module: system.permissions
      op: grant
      args: {permission: "android.permission.CAMERA"}
      expect:
        ok: true

  - tap:
      selector: {text: {exact: "Capture JPEG"}}
  - wait_for:
      selector: {text: {contains: "JPEG closed id=0 seq=1"}}
      timeout_ms: 30000

  # Decoded bitmap really is 640x480; asserting 1280x720 must fail.
  - assert_text:
      selector: {id: status}
      text: {contains: "bmp=1280x720"}
