# NEGATIVE: the app is correct but the expectation is wrong.
# Must produce status=fail (ASSERTION_FAILED), never pass.
version: 1
name: negative-wrong-text
description: Assert a result string that the fixture never renders.
app: fixtures/build/apps/hello-views.apk
engine: native-preferred
fallback: forbid
api_level: 34
isolation: process
display: {mode: offscreen, width: 1080, height: 2400, density_dpi: 420}
expectation: fail
steps:
  - launch:
      activity: dev.acos.fixtures.helloviews/.MainActivity
      clear_state: true
  - wait_for:
      selector: {id: result}
      timeout_ms: 5000
  - assert_text:
      selector: {id: result}
      text: {exact: "clicks: 9"}
