# gaten-content-assert-screenshot: NEGATIVE CONTROL for SE2's pixel rule, on the
# other pixel assertion.
#
# `assert_region` on a content-settled screen is refused
# (`scenarios/negative/gaten-content-pixel.yaml`). A screenshot comparison is the
# same pixel claim and must be refused the same way: `ASSERTION_FAILED`,
# `details.reason: "content_settle_pixel"`, `details.pixel_evidence: false`,
# before any capture or baseline read. `expect_error` pins exactly that failure,
# so this control cannot go green on a timeout or on some other assertion.
version: 1
name: gaten-content-assert-screenshot
description: >-
  SE2 negative: assert_screenshot bound to a content-settled forever-animating
  screen is a failed binding, never a pixel comparison.
app: /home/Qui/Projects/acos/.cache/gaten/gaten-dev-f344272-x86_64-release-unsigned.apk
engine: native-preferred
fallback: forbid
api_level: 34
isolation: process
display: {mode: offscreen, width: 1080, height: 2400, density_dpi: 400}
animations: off
expectation: fail
expect_error: {code: ASSERTION_FAILED, reason: content_settle_pixel}
budgets: {memory_mib: 4096, wall_ms: 240000}
steps:
  - launch:
      activity: com.gaten.app.MainActivity
      clear_state: true
      settle: content
      settle_timeout_ms: 20000
  # A pixel claim on the content-settled frame: refused before the baseline is
  # even opened (the path below is deliberately irrelevant).
  - assert_screenshot: {baseline: /nonexistent/content-settled-baseline.png, tolerance: 0.0}
