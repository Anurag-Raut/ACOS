# T09 wrong: after reset the expectation keeps the pre-reset count 1. The reset
# relaunches a fresh guest with count 0, so this must fail ASSERTION_FAILED.
version: 1
name: T09-reset-wrong
description: >-
  Increment to 1, reset, then assert the pre-reset state 1.
app: fixtures/build/apps/counter.apk
engine: native-preferred
fallback: forbid
api_level: 34
isolation: process
display: {mode: offscreen, width: 1080, height: 2400, density_dpi: 420}
expectation: fail
budgets: {memory_mib: 512, wall_ms: 120000}
steps:
  - launch: {activity: dev.acos.fixtures.counter/.MainActivity, clear_state: true}
  - tap: {selector: {id: inc}}
  - assert_text: {selector: {id: count}, text: {exact: "1"}}
  - reset: {scope: app}
  - assert_text: {selector: {id: count}, text: {exact: "1"}}
