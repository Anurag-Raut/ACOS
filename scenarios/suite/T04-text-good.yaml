# T04 correct: long text / RTL / spanned runs on widget-gallery.
#
# Scope note (recorded in INDEX.yaml): the advisor's original T04 asked for the
# widget-gallery under fontScale=1.3 + locale=ar. The scenario format has no
# font-scale launch parameter and `set_locale` maps to the ART engine's absent
# `environment` capability, so that part is UNSUPPORTED. This variant verifies
# the same rendering concerns with the fixture's own long ellipsized line, its
# RTL Arabic line and a multi-style spanned run.
version: 1
name: T04-text-good
description: >-
  Launch widget-gallery and assert the long ellipsized text, the RTL Arabic
  line and the bold/italic/normal spanned run from the live tree.
app: fixtures/build/apps/widget-gallery.apk
engine: native-preferred
fallback: forbid
api_level: 34
isolation: process
display: {mode: offscreen, width: 1080, height: 2400, density_dpi: 420}
expectation: pass
budgets: {memory_mib: 512, wall_ms: 120000}
steps:
  - launch: {activity: dev.acos.fixtures.widgetgallery/.MainActivity, clear_state: true}
  - assert_text:
      selector: {id: ellipsize}
      text: {contains: "A very long line that must be truncated at the end of the available width"}
  - assert_text: {selector: {id: rtl}, text: {exact: "مرحبا بالعالم"}}
  - assert_text: {selector: {id: styles}, text: {exact: "bold italic normal"}}
  - assert_text: {selector: {id: input}, text: {exact: "Enter text"}}
