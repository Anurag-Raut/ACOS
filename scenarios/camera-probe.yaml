# CAMERA2 Slice 1 positive proof: `hw.camera` at `stub` on real ART.
#
# Exercises the real framework CameraManager -> ICameraService (`media.camera`)
# -> JNI libcamera_client.so + libcamera_metadata.so path:
#   * `hasSystemFeature(FEATURE_CAMERA / FEATURE_CAMERA_ANY)` is true;
#   * `getCameraIdList()` returns `["0"]`;
#   * `getCameraCharacteristics("0")` parses & validates the native metadata
#     blob (LENS_FACING=BACK, SENSOR_ORIENTATION=90, HARDWARE_LEVEL=LIMITED,
#     4000x3000 array, StreamConfigurationMap JPEG & YUV_420_888 sizes);
#   * `getCameraCharacteristics("99")` throws IllegalArgumentException;
#   * `openCamera("0")` throws SecurityException while CAMERA is denied, and
#     structured UnsupportedOperationException (UNSUPPORTED_ANDROID_API) once
#     CAMERA is granted via `system.permissions` (Slice 2 boundary).
version: 1
name: camera-probe
description: >-
  hw.camera stub on ART: CameraManager.getCameraIdList, real validated
  CameraCharacteristics & StreamConfigurationMap, unknown-id IllegalArgumentException,
  CAMERA permission enforcement on openCamera, and structured Slice-2 refusal.
app: fixtures/build/apps/camera-probe.apk
api_level: 34
isolation: process
display:
  mode: offscreen
  width: 1080
  height: 2400
  density_dpi: 420
capabilities:
  - ui.offscreen
  - ui.text
  - input
services:
  - id: system.permissions
    profile: real
  - id: hw.camera
    profile: stub
expectation: pass
budgets:
  memory_mib: 640
  wall_ms: 180000
steps:
  - launch:
      activity: dev.acos.fixtures.cameraprobe/.MainActivity
      clear_state: true
  - wait_for:
      selector: {text: {contains: "READY mgr=present feat_cam=true feat_any=true"}}
      timeout_ms: 20000

  - tap:
      selector: {text: {exact: "List"}}
  - wait_for:
      selector: {text: {contains: "LIST count=1 ids=[0]"}}
      timeout_ms: 20000

  - tap:
      selector: {text: {exact: "Chars"}}
  - wait_for:
      selector: {text: {contains: "CHARS facing=BACK orient=90 level=LIMITED array=4000x3000 active=4000x3000 flash=false focal=4.38 jpeg=9(4000x3000) yuv=9 caps=[0]"}}
      timeout_ms: 20000

  - tap:
      selector: {text: {exact: "Unknown"}}
  - wait_for:
      selector: {text: {contains: "UNKNOWN error=IllegalArgumentException"}}
      timeout_ms: 20000

  # Before CAMERA permission is granted -> SecurityException (ERROR_PERMISSION_DENIED).
  - tap:
      selector: {text: {exact: "Open"}}
  - wait_for:
      selector: {text: {contains: "OPEN error=SecurityException"}}
      timeout_ms: 20000

  # Grant CAMERA via system.permissions, then openCamera hits the structured Slice-2 refusal.
  - service_ctl:
      module: system.permissions
      op: grant
      args: {permission: "android.permission.CAMERA"}
      expect:
        ok: true
  - tap:
      selector: {text: {exact: "Open"}}
  - wait_for:
      selector: {text: {contains: "OPEN error=UnsupportedOperationException"}}
      timeout_ms: 20000

  - service_ctl:
      module: hw.camera
      op: camera
      expect:
        ok: true
        op: camera
        value:
          id: "0"
          facing: back
          orientation: 90
          width: 4000
          height: 3000
