# gaten-home: Gaten (RN 0.86.3 / Fabric / Hermes) on REAL ART — GR1 target scenario.
#
# This is the owner-facing flow: launch the app's own launcher Activity on the
# ART engine (no frozen RN driver), read its first screen, walk the three
# onboarding Skip pages, and land on the Home tab (wordmark, search field, Daily
# streak, Anki, WaniKani, Recently looked up, Home/Analytics/Settings bar), then
# open Analytics.
#
# The APK is never committed. Override the path with `--apk`, or drop the x86_64
# release build at the default path below (`acos inspect` / `--engine art` only
# needs the APK; no signing).
#
# Onboarding note (GR3): the welcome screen runs a 10 s looping Reanimated
# timeline and the Skip pages arm a 200 ms auto-advance retry, so a strict settle
# on those screens honestly times out (results/gaten/GR3.md §1). The first tap
# waits through the welcome transition strictly; the three Skip taps are
# navigation (`settle: fast`, never assertion evidence). Every state the
# scenario claims is then proven strictly: the Home wait/capture/asserts, and the
# Analytics wait/capture/assert. Assertions run on a capture's bound frame.
version: 1
name: gaten-home
description: >-
  Gaten's own MainActivity on real ART: first screen, onboarding skips, Home tab
  with its texts, then the Analytics tab.
app: /home/Qui/Projects/acos/.cache/gaten/gaten-dev-f344272-x86_64-release-unsigned.apk
engine: native-preferred
fallback: forbid
api_level: 34
isolation: process
display: {mode: offscreen, width: 1080, height: 2400, density_dpi: 400}
animations: off
expectation: pass
budgets: {memory_mib: 4096, wall_ms: 240000}
steps:
  - launch: {activity: com.gaten.app.MainActivity, clear_state: true}
  - tap: {selector: {text: {contains: "Set up Gaten"}}, settle_timeout_ms: 5000}
  - tap: {selector: {text: {exact: Skip}}, settle: fast}
  - tap: {selector: {text: {exact: Skip}}, settle: fast}
  - tap: {selector: {text: {exact: Skip}}, settle: fast}
  # Home settles (no endless timeline), so this is a strict, event-settled wait.
  - wait_for: {selector: {text: {contains: "Recently looked up"}}, timeout_ms: 30000}
  - capture: {name: gaten-home, format: png, fresh: true}
  - assert_text: {selector: {text: {contains: "Daily streak"}}, text: {contains: "Daily streak"}}
  - assert_text: {selector: {text: {contains: "Recently looked up"}}, text: {contains: "Recently looked up"}}
  - assert_text: {selector: {text: {exact: "Anki"}}, text: {exact: "Anki"}}
  # The tab bar's own pressable, not a text node: the tree also carries the
  # (warm-mounted, off-screen) Analytics *page*, whose "Analytics" text sits at
  # x=1080..2160 and whose centre falls inside the Home segment. A text selector
  # therefore taps Home and the step still "passes" (input delivered, nothing
  # claimed) — see results/gaten/GR2.md W3. `content_desc` names the pressable.
  - tap: {selector: {content_desc: {exact: Analytics}}}
  - wait_for: {selector: {text: {contains: "Accuracy"}}, timeout_ms: 30000}
  - capture: {name: gaten-analytics, format: png, fresh: true}
  - assert_text: {selector: {text: {contains: "Study activity"}}, text: {contains: "Study activity"}}
