# gaten-bubble-overlay: the bubble's own window — a KNOWN WALL, pinned.
#
# This is the target this track could not reach, kept as an executable assertion
# (`expectation: fail` + pinned `ASSERTION_FAILED`) so the fix is one flip away:
# when the wall below goes, set `expectation: pass` and keep the steps.
#
# The wall (results/handoff/GATENBOOT/README.md §2, measured 2026-11-16):
#
#   Gaten's `GatenAccessibilityService.syncFloatingButton()` shows the bubble from
#   `onServiceConnected` only while `TriggerPreferences.floatingButtonEnabled` is
#   true, and it learns about a change to that flag through the runtime-registered
#   broadcast `com.gaten.app.action.FLOATING_BUTTON_CHANGED` it registers in
#   `registerTriggerReceiver()`. ACOS's AMS accepts and records `sendBroadcast`
#   but delivers nothing to the guest (`docs/IMAGE_ABI_NOTEBOOK.md`,
#   `IActivityManager` §`registerReceiver`: "it does not deliver broadcasts to the
#   guest: there is no receiver scheduler on the ART host"). So on ART the switch
#   writes the preference and the service is never told: the bubble is not added,
#   and the window stack stays [application].
#
#   Two exits, both outside the process bootstrap this track owns:
#   (a) a guest-side broadcast scheduler (AMS -> runtime-registered receivers) —
#       a subsystem, an orchestrator decision;
#   (b) the accessibility module binding an enabled service when the *enable set*
#       changes, the way AOSP's `AccessibilityManagerService.setEnabledServices`
#       -> `bindServices` does, instead of only from the app's `IAccessibilityManager.addClient`.
#       With (b), the sequence below (switch on, then detach + attach the module)
#       rebinds the service, `onServiceConnected` runs again with the preference
#       on, and the bubble window is added. That is the smaller change and it is
#       AOSP-faithful; it belongs to the accessibility module's track
#       (MODA11Y), not to the bootstrap.
#
# Drag needs `dispatchGesture` (MODA11Y7 §1) and is deliberately absent.
version: 1
name: gaten-bubble-overlay
description: >-
  The TYPE_ACCESSIBILITY_OVERLAY bubble window above the activity, its content in
  the tree, and a tap on it. Known wall: Gaten shows the bubble only on a
  runtime-registered broadcast, which ACOS does not deliver (README §2).
app: /home/Qui/Projects/acos/.cache/gaten/gaten-dev-f344272-x86_64-release-unsigned.apk
engine: native-preferred
fallback: forbid
api_level: 34
isolation: process
display: {mode: offscreen, width: 1080, height: 2400, density_dpi: 400}
animations: off
expectation: fail
expect_error: {code: ASSERTION_FAILED}
budgets: {memory_mib: 4096, wall_ms: 240000}
services:
  - id: accessibility
    profile: real
    config:
      enable:
        - com.gaten/com.gaten.app.GatenAccessibilityService
steps:
  - launch: {activity: com.gaten.app.MainActivity, clear_state: true}
  - tap: {selector: {text: {contains: "Set up Gaten"}}, settle_timeout_ms: 5000}
  - tap: {selector: {text: {exact: Skip}}, settle: fast}
  - tap: {selector: {text: {exact: Skip}}, settle: fast}
  - tap: {selector: {text: {exact: Skip}}, settle: fast}
  - wait_for: {selector: {text: {contains: "Recently looked up"}}, timeout_ms: 30000}
  - tap: {selector: {content_desc: {exact: Settings}}}
  - wait_for: {selector: {text: {exact: "Screen lookup"}}, timeout_ms: 30000}
  - tap: {selector: {text: {exact: "Screen lookup"}}}
  - wait_for: {selector: {text: {exact: "Floating button"}}, timeout_ms: 30000}
  # With the service bound, lookup mode is On and this flips the floating-button
  # preference on (proved: the row's switch reports `checked: true` afterwards).
  - tap: {selector: {content_desc: {exact: "Floating button"}}, settle: fast}
  # (b) in the header: rebinding is what a fixed accessibility module would make
  # the service read the preference again.
  - service_ctl: {module: accessibility, op: detach}
  - service_ctl:
      module: accessibility
      op: attach
      profile: real
      config:
        enable:
          - com.gaten/com.gaten.app.GatenAccessibilityService
  - capture: {name: gaten-bubble, format: png, fresh: true}
  - assert_windows:
      order: [application, accessibility_overlay]
      types: [TYPE_BASE_APPLICATION, TYPE_ACCESSIBILITY_OVERLAY]
  - assert_text:
      selector: {text: {contains: "Look up"}}
      text: {contains: "Look up"}
