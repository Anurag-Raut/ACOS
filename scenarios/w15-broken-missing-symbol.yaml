# W15 compatibility scenario: broken-missing-symbol on the real ART interactive engine.
# Minimal, honest: launch + app-specific assertion(s); no log/rotate/reset steps.
version: 1
name: w15-broken-missing-symbol
description: >-
  Launch broken-missing-symbol on real ART and verify its first observable UI state. Part of
  the W15 fixture-app compatibility matrix (results/art-runtime/W15.md).
app: fixtures/build/apps/broken-missing-symbol.apk
engine: native-preferred
fallback: report-and-escalate
api_level: 34
isolation: process
display:
  mode: offscreen
  width: 1080
  height: 2400
  density_dpi: 420
capabilities:
  - lifecycle
  - ui.text
  - input
# SCENHYG: declared honestly. The fixture is the deliberately broken one (a missing native symbol), so "never pass" is its stated intent. The launch ends
# before the first frame (GUEST_EXITED), which is a structured error, not a pass;
# the scenario pins that code so it cannot go red for something unrelated.
expectation: non_pass
expectation_reason: >-
  The APK cannot start on this image (GUEST_EXITED before the first frame); the
  scenario proves the structured refusal, never a pass.
expect_error: {code: GUEST_EXITED}
budgets:
  memory_mib: 512
  wall_ms: 120000
steps:
  - launch:
      activity: dev.acos.fixtures.hellojni/.MainActivity
      clear_state: true
  # Deliberately broken fixture: missing native symbol. Expected to fail, never pass.
