# v2-art-counter: the decisive `acos verify --engine art` scenario.
#
# counter.apk -> real Activity on ART -> live View tree -> tap Increment
# -> count 0 becomes 1 -> fresh screenshot -> reset -> tap again (count 1).
#
# This file deliberately has no `assert_log`/`back`/`rotate`/`type` steps: the
# ART session protocol has no log, rotate or text-input command yet, so those
# steps would be reported `unsupported` with the missing capability named.
# Add them here only when the session exposes the command
# (results/art-runtime/V2.md, results/art-runtime/V3-session-loop.md).
#
# Enforced by the engine seam, not by convention:
#   * each `tap` must complete its own frame (`frame_seq` advances); a reused
#     frame fails with NO_FRESH_FRAME / STALE_FRAME and is never a pass;
#   * `capture: fresh` must complete a newer frame than the preceding step and
#     carries the frame sequence + host capture time as evidence;
#   * `assert_text` after `tap`/`reset` observes the frame that action produced
#     (the engine does not invent a newer traversal for a pure assertion);
#   * `reset` is not a session command on the real launch engine (no shell
#     command reaches the guest): the scenario taps the app's own Reset control,
#     and the following `wait_for` binds the fresh frame the tap produced;
#   * the session's whole process group is torn down and checked (a survivor is
#     reported, never silently ignored).
version: 1
name: v2-art-counter
description: >-
  Launch counter on real ART, assert the live tree (count/inc texts), tap
  Increment, assert count 0 -> 1, take a fresh screenshot, tap Reset, assert
  back to 0, then tap Increment again and assert 1. No log/rotate/type/reset
  steps: the real launch session has no command for those (Reset is the app's
  own button).
app: fixtures/build/apps/counter.apk
engine: native-preferred
fallback: report-and-escalate
api_level: 34
isolation: process
display:
  mode: offscreen
  width: 1080
  height: 2400
  density_dpi: 420
capabilities:
  - lifecycle
  - ui.text
  - input
expectation: pass
budgets:
  memory_mib: 512
  wall_ms: 120000
steps:
  - launch:
      activity: dev.acos.fixtures.counter/.MainActivity
      clear_state: true

  - wait_for:
      selector: {id: count}
      timeout_ms: 5000

  - assert_text:
      selector: {id: count}
      text: {exact: "0"}

  - assert_text:
      selector: {id: inc}
      text: {exact: Increment}

  # The decisive transition: 0 -> 1 through the app's own click listener.
  - tap:
      selector: {id: inc}

  - assert_text:
      selector: {id: count}
      text: {exact: "1"}

  - capture:
      name: art-after-inc1
      format: png
      fresh: true

  # Reset -> back to 0 through the app's own Reset click listener. The real
  # launch engine has no shell-like `reset` command, so this is a tap.
  - tap:
      selector: {id: reset}

  - assert_text:
      selector: {id: count}
      text: {exact: "0"}

  - tap:
      selector: {id: inc}

  - assert_text:
      selector: {id: count}
      text: {exact: "1"}
