version: 1
name: metro-reload
description: >-
  The React Native dev loop on ACOS, Fast Refresh path (the dev-loop default,
  METRO3): a debug RN app renders Metro's bundle; a component edit to the project
  copy is served, delivered over Metro's /hot websocket (same JS context, no
  reload sent), and the app shows the new text once, no copy of the old text, and
  a tree no larger than before.
app: fixtures/build/apps/rn-debug.apk
engine: native-preferred
fallback: report-and-escalate
api_level: 34
isolation: process
display:
  mode: offscreen
  width: 1080
  height: 2400
  density_dpi: 420
capabilities:
  - lifecycle
  - ui.offscreen
  - ui.text
services:
  - id: network
    profile: real
# Needs the pinned host pasta (network:real) and node + Metro (`acos doctor`:
# checks `pasta`, `metro`). Without them the runner skips the file and says why.
expectation: pass
needs_env: [pasta, metro]
expectation_reason: >-
  The Metro dev server runs on the host and reaches the guest through the
  network:real relay; without pasta or node+Metro the arm cannot be honest.
budgets:
  memory_mib: 512
  wall_ms: 600000
steps:
  # The Metro this run owns: a COPY of fixtures/apps/rn-hello-dev (the source tree
  # is never edited), started before the guest exists, with the relay's
  # host-loopback opt-in for its port (the `adb reverse` equivalent): the debug
  # app fetches its bundle during Application.onCreate.
  - dev_server:
      op: start
      project: fixtures/apps/rn-hello-dev
      port: 8081
      timeout_ms: 180000

  - launch:
      activity: dev.acos.fixtures.rnhello/.MainActivity
      clear_state: true
      settle_timeout_ms: 120000

  # What Metro served at launch, rendered once.
  - assert_text:
      selector: {text: {exact: "Hello ACOS"}}
      text: {exact: "Hello ACOS"}
      timeout_ms: 120000

  - assert_tree: {record: before, timeout_ms: 10000}

  # The developer's edit, to the COPY of the project.
  - dev_server:
      op: edit
      file: App.js
      find: "'Hello ACOS'"
      replace: "'Hello Metro'"

  # Metro rebuilt: the bundle it serves has the new string and not the old one.
  - dev_server:
      op: wait_serves
      contains: "Hello Metro"
      absent: "Hello ACOS"
      timeout_ms: 120000

  # Fast Refresh: no reload is sent. The update reaches the running app over
  # Metro's /hot websocket on its own; this step waits until Metro serves it.
  - dev_server: {op: fast_refresh, timeout_ms: 120000}

  - assert_text:
      selector: {text: {exact: "Hello Metro"}}
      text: {exact: "Hello Metro"}
      timeout_ms: 60000

  # exactly the one new copy, no stale copy of the old text, no extra root
  - assert_not_visible:
      selector: {text: {exact: "Hello ACOS"}}
      timeout_ms: 10000

  - assert_tree: {not_grown_since: before, timeout_ms: 10000}

  - dev_server: {op: stop}

  - assert_no_crash: {}
