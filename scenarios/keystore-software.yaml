# ADR-0029 `security.keystore` proof: software-backed `AndroidKeyStore` attached at launch.
#
# Attaches `{id: security.keystore, profile: real}` and launches `keystore-probe`,
# which auto-selects `launch_fidelity` because `LaunchMain` installed
# `SoftwareKeyStore` before `Application` / `Activity` code ran. Exercises
# key generation (AES-256-GCM/CBC, HMAC, RSA, EC), AAD + AlgorithmParameters GCM,
# opaque key handles, KeyInfo (`SECURITY_LEVEL_SOFTWARE`,
# `isInsideSecureHardware() == false`), purpose/validity/randomized-IV refusals,
# explicit attestation & user-auth refusal, 0600/0700 storage, and `service_ctl status`.
version: 1
name: keystore-software
description: >-
  keystore-probe on ART with `security.keystore:real`: verifies LaunchMain
  installs the software-backed AndroidKeyStore provider (`SECURITY_LEVEL_SOFTWARE`),
  all crypto/refusal/persistence fidelity assertions pass with `fail=0`, and
  `acos_service_ctl status` reports non-hardware-backed limits honestly.
app: fixtures/build/apps/keystore-probe.apk
engine: art
fallback: report-and-escalate
api_level: 34
isolation: process
display:
  mode: offscreen
  width: 1080
  height: 2400
  density_dpi: 420
capabilities:
  - ui.offscreen
  - ui.text
services:
  - id: security.keystore
    profile: real
expectation: pass
budgets:
  memory_mib: 640
  wall_ms: 180000
steps:
  - launch:
      activity: dev.acos.fixtures.keystoreprobe/.MainActivity
      clear_state: true

  - wait_for:
      selector: {text: {contains: "KEYPROBE mode=launch_fidelity"}}
      timeout_ms: 20000

  - assert_text:
      selector: {text: {contains: "KEYPROBE mode=launch_fidelity"}}
      text: {regex: "^KEYPROBE mode=launch_fidelity pass=[1-9][0-9]* fail=0$"}
      timeout_ms: 10000

  - assert_log:
      tag: KeystoreProbe
      since_previous_step: false
      timeout_ms: 10000
      patterns:
        - "^KEYPROBE mode=launch_fidelity pass=[1-9][0-9]* fail=0$"

  - service_ctl:
      module: security.keystore
      op: status
      args: {}
